apply plugin: 'com.android.application'
apply plugin: 'realm-android'
android {
    namespace 'com.cookandroid.mth'
    compileSdk 34

    defaultConfig {
        applicationId "com.cookandroid.mth"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // OkHttp (서버 통신 - 백엔드 방식용)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // MongoDB Realm Android SDK (직접 연결용)
    implementation 'io.realm:realm-android-library:10.14.0'
    implementation 'io.realm:realm-android-kotlin-extensions:10.14.0'

    // MPAndroidChart (차트)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}